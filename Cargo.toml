[package]
name = "folio"
version = "0.2.5"
edition = "2021"
authors = ["Geir Isene <g@isene.com>"]
description = "Terminal PDF reader: pages as text, as images, or both at once. Part of the Fe2O3 suite, built on crust."
license = "Unlicense"
repository = "https://github.com/isene/folio"

[dependencies]
crust = { version = "0.1", path = "../crust", package = "fe2o3-crust" }
glow  = { version = "0.1", path = "../glow",  package = "fe2o3-glow" }

[profile.release]
opt-level = 3
lto = true
strip = true
